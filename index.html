<style>
/* Nuit premium · bleu (maquette B1) : fond bleu nuit avec halo, cartes en verre, accent menthe, corail pour les sorties */
:root{
  --bg:#0A1226; --bg2:#0C1530; --card:#111A2E; --card2:#152038; --line:#1F2A40; --line2:#2A3754;
  --ink:#E7ECF5; --muted:#8D99B0; --faint:#5F6B85;
  --mint:#5EEAD4; --mint-ink:#06201C; --coral:#FF7A6B; --amber:#FFB86B; --blue:#7CA8FF; --violet:#A78BFA;
  --ok:#5EEAD4; --warn:#FFB86B; --bad:#FF7A6B;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --m:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:20px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(120% 55% at 85% -12%,#1E3F7A 0%,rgba(10,18,38,0) 62%),var(--bg);background-attachment:fixed;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.num{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.pos{color:var(--mint)} .neg{color:var(--coral)} .muted{color:var(--muted)} .faint{color:var(--faint)}
.wrap{max-width:1120px;margin:0 auto}
[hidden]{display:none!important}

/* ---------- En-tête ---------- */
.top{display:flex;align-items:center;gap:14px;padding:18px 0 14px;flex-wrap:wrap}
.top .hello{margin-right:auto;min-width:0}
.top .hello small{display:block;color:var(--muted);font-size:13px}
.top .hello b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.mnav{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:4px}
.mnav button{width:34px;height:34px;border:0;background:transparent;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.mnav button:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.mnav span{min-width:118px;text-align:center;font-weight:700;font-size:14px}
.avatar{width:40px;height:40px;border-radius:12px;background:rgba(94,234,212,.12);border:1px solid rgba(94,234,212,.3);color:var(--mint);display:grid;place-items:center;font-weight:800}
nav.tabs{display:flex;gap:4px}
nav.tabs button{border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:12px;font-weight:600;display:flex;align-items:center;gap:7px}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button.on{color:var(--mint);background:rgba(94,234,212,.08)}
@media (max-width:820px){
  nav.tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(9,14,28,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
    justify-content:space-around;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex-direction:column;gap:3px;font-size:11px;padding:6px 4px;flex:1;background:transparent!important}
  .top{padding-top:14px}
  .mnav span{min-width:100px}
}

/* ---------- Cartes ---------- */
main{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
@media (min-width:900px){.g2{grid-template-columns:1.25fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g2e{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ch h2{font-size:15px;margin:0;font-weight:700}
.ch .s{font-size:12px;color:var(--muted)}
.glass{border-radius:24px;padding:18px;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden}
.hero .k{font-size:12.5px;color:var(--muted)}
.hero .v{font-family:var(--m);font-size:clamp(30px,8vw,40px);font-weight:500;letter-spacing:-.05em;margin:4px 0 8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(94,234,212,.12);color:var(--mint)}
.pill.bad{background:rgba(255,122,107,.12);color:var(--coral)} .pill.warn{background:rgba(255,184,107,.12);color:var(--amber)}
.hero .row2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.hero .row2 div small{display:block;font-size:11px;color:var(--muted)} .hero .row2 div b{font-family:var(--m);font-weight:500;font-size:15px}
.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acct{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.acct .dot{width:8px;height:8px;border-radius:50%;margin-bottom:8px}
.acct small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct b{font-family:var(--m);font-weight:500;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.kpi small{display:block;color:var(--muted);font-size:11.5px}
.kpi b{font-family:var(--m);font-weight:500;font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:11.5px;color:var(--faint)}

/* ---------- Listes ---------- */
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .bar4{width:4px;align-self:stretch;border-radius:4px;flex:none;min-height:28px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-family:var(--m);font-size:14px;white-space:nowrap}
.day{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:14px 0 4px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.fix{background:rgba(124,168,255,.12);color:var(--blue)} .tag.neu{background:rgba(255,255,255,.05)} .tag.todo{background:rgba(255,184,107,.12);color:var(--amber)} .tag.okk{background:rgba(94,234,212,.12);color:var(--mint)}
.ibtn{width:32px;height:32px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.ibtn:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.ibtn svg{width:16px;height:16px}
.confirm{border:0;background:var(--coral);color:#2A0A06;border-radius:10px;padding:6px 10px;font-weight:700;font-size:12.5px;white-space:nowrap}

/* ---------- Jauges ---------- */
.avleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);margin:2px 0 4px}
.avleg i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line2);vertical-align:-1px;margin-right:5px}
.avleg i.o{background:var(--mint);border-color:var(--mint)}.avleg i.r{border-color:var(--blue);background:rgba(124,168,255,.25)}
.avtog{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:8px 0;cursor:pointer;display:block;width:100%;text-align:left}
.avbox{margin:8px 0;padding:12px;border:1px solid rgba(124,168,255,.45);border-radius:14px;background:rgba(124,168,255,.06)}
.avbox p{margin:4px 0;font-size:13px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.mchips::-webkit-scrollbar{display:none}
.mchip{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.mchip.on{background:var(--mint);color:var(--mint-ink);border-color:var(--mint);font-weight:600}
.row.nextm .t b,.row.nextm .a{color:var(--blue)}
.t small .tag{margin-left:0;margin-top:3px;display:inline-block}
.tag.nm{background:rgba(124,168,255,.14);color:var(--blue)}
.bd{font-size:10.5px;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap;font-weight:600}
.bd.g{background:rgba(255,255,255,.08);color:#B7C0D4}.bd.bl{background:rgba(124,168,255,.18);color:var(--blue)}.bd.gr{background:rgba(94,234,212,.16);color:var(--mint)}
.optabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:0 0 12px}@media(min-width:760px){.optabs{grid-template-columns:repeat(4,1fr)}}.optabs button{white-space:normal;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 13.5px 'DM Sans',sans-serif;cursor:pointer}.optabs button .cnt{display:inline-block;min-width:20px;padding:1px 6px;margin-left:4px;border-radius:999px;background:rgba(255,184,107,.2);color:var(--amber);font-size:12px}.optabs button.on .cnt{background:rgba(94,234,212,.25);color:var(--mint)}.optabs button.on{background:rgba(94,234,212,.12);color:var(--mint);border-color:rgba(94,234,212,.4)}
.avh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 4px;padding-top:12px;border-top:1px solid var(--line)}.avh:first-of-type{border-top:0;padding-top:0;margin-top:4px}.avh b{font-size:14.5px}.avh span{font-size:12px;color:var(--muted)}
.ab{border:1px solid var(--line2);background:rgba(124,168,255,.1);color:var(--blue);border-radius:999px;padding:6px 11px;font:600 12px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap}
.mc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;background:rgba(124,168,255,.05)}.mc.on{border-color:rgba(124,168,255,.5)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (min-width:900px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;padding:12px 58px 12px 12px;color:inherit;font:inherit;cursor:pointer;min-height:84px}
.tile.on{border-color:rgba(124,168,255,.6);background:rgba(124,168,255,.07)}
.tile .n{font-size:12.5px;color:var(--muted);margin-bottom:4px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .v{font-size:18px;font-weight:500}
.tile .p{font-size:11.5px;color:var(--muted);margin-top:2px}
.tring{position:absolute;right:10px;top:12px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-family:'DM Mono',monospace}
.tring i{position:absolute;inset:5px;background:#101a33;border-radius:50%}.tring span{position:relative}
.tdetail{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02)}
label.btn{display:inline-flex;align-items:center;justify-content:center}
.av .row{align-items:center}
.av .t b,.av .t small{white-space:normal;overflow:visible;text-overflow:clip}
.avs span:first-child{max-width:68%}
.avck{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--mint);display:grid;place-items:center;cursor:pointer;flex:none}
.avck:hover{background:rgba(94,234,212,.12)}
.avck{color:var(--muted);border-color:var(--line2)}
.avck.ok{background:var(--mint);color:var(--mint-ink);border-color:var(--mint)}
.avck,.avck.ok,.avck.rec{width:32px;height:32px;flex:none}.avck svg{width:16px;height:16px}
.avck.rec{border-color:var(--blue);color:var(--blue);background:rgba(124,168,255,.12)}
.avck.off{opacity:1;cursor:default}.avck.off:not(.ok):not(.rec){border-style:dashed;opacity:.5}
.avs{font:600 11px 'DM Mono',monospace;color:var(--muted);letter-spacing:.08em;margin:12px 0 2px;display:flex;justify-content:space-between}
.gauge{padding:10px 0;border-bottom:1px solid var(--line)}
.gauge:last-child{border-bottom:0}
.gauge .h{display:flex;align-items:center;gap:10px}
.gauge .h b{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge .h .lim{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.gauge .h input{width:78px;height:30px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);text-align:right;padding:0 8px;font-family:var(--m);font-size:13px}
.track{height:8px;border-radius:8px;background:#1A2540;overflow:hidden;margin-top:8px}
.track i{display:block;height:100%;border-radius:8px}
.gauge .f{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;gap:8px}
.gauge.sub{padding-left:16px}
.gauge.sub .h b{font-weight:500;font-size:13.5px;color:var(--muted)}

/* ---------- Formulaires ---------- */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 1px;font-weight:600;font-size:11px;white-space:nowrap;color:var(--muted);line-height:1.2}
.seg button.on{background:var(--mint);color:var(--mint-ink)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:11.5px;color:var(--muted);font-weight:600}
.in,select.in,textarea.in{width:100%;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);padding:0 12px}
textarea.in{height:70px;padding:10px 12px;resize:vertical}
.in:focus{border-color:var(--mint);outline:none;box-shadow:0 0 0 3px rgba(94,234,212,.15)}
.btn{height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);padding:0 16px;font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn.danger{background:transparent;border-color:rgba(255,122,107,.4);color:var(--coral)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1;min-width:160px}
.kind{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:3px;height:42px}
.kind button{flex:1;border:0;background:transparent;border-radius:9px;font-weight:600;font-size:12px;padding:0 2px;color:var(--muted)}
.kind button.on[data-k="av"]{background:rgba(251,191,36,.16);color:var(--amber)}
.kind button.on[data-k="dep"]{background:rgba(255,122,107,.16);color:var(--coral)}
.kind button.on[data-k="rev"]{background:rgba(94,234,212,.16);color:var(--mint)}
.kind button.on[data-k="neu"]{background:rgba(255,255,255,.08);color:var(--ink)}

/* ---------- Graphiques ---------- */
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tbw{overflow-x:auto;margin-top:8px}
.row .t b[style*="display:block"] .tag{display:table;margin:4px 0 0}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th{color:var(--muted);font-weight:500;font-size:12px;text-align:right;padding:6px 4px;white-space:nowrap}
.tb td{text-align:right;padding:6px 4px;font-size:12px;border-top:1px solid var(--line);white-space:nowrap;font-family:var(--m);font-variant-numeric:tabular-nums}
.tb th:first-child,.tb td:first-child{text-align:left;font-family:inherit;position:sticky;left:0;background:var(--card)}
.tb tr.hl td{background:rgba(255,184,107,.08)}
.ychips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.ychips .mchip{padding:5px 11px}
.donut{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:420px){.donut{grid-template-columns:110px minmax(0,1fr)}}

/* ---------- Divers ---------- */
.banner{border-radius:16px;padding:12px 14px;font-size:13.5px;background:rgba(124,168,255,.1);border:1px solid rgba(124,168,255,.25);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--mint);color:#06302B;font-size:24px;display:grid;place-items:center;box-shadow:0 10px 26px rgba(94,234,212,.35);cursor:pointer;z-index:40}

.sheet-bg{position:fixed;inset:0;background:rgba(3,7,18,.6);z-index:50}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(640px,100%);max-height:88vh;overflow:auto;z-index:51;padding:12px 12px calc(16px + env(safe-area-inset-bottom))}
.sheet>.card{margin:0}
.win{background:linear-gradient(135deg,#123A3A,#13254A);border:1px solid #2A5A5A}
.win .tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.win .tl div{background:rgba(10,26,46,.6);border-radius:14px;padding:12px}
.win .tl b{display:block;font-family:var(--m);font-weight:500;font-size:28px;color:var(--mint)}
.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--card,#111B33);display:grid;place-items:center;font-family:var(--m);font-size:13px}
.click{cursor:pointer}
.login{max-width:420px;margin:12vh auto 0;text-align:center}
.login h1{font-size:28px;margin:12px 0 4px;letter-spacing:-.02em}
.logo{width:64px;height:64px;border-radius:20px;margin:0 auto;background:linear-gradient(145deg,#1E3F7A,#0A1226);border:1px solid rgba(94,234,212,.35);display:grid;place-items:center;color:var(--mint);font-family:var(--m);font-size:28px}
.prog{height:6px;border-radius:6px;background:#1A2540;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);border-radius:6px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
@media (prefers-reduced-motion:no-preference){.track i,.prog i{transition:width .5s ease}}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="login" id="loading"><div class="logo">€</div><h1>Mes Finances</h1><p class="muted">Chargement…</p></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* =====================================================================
   OUTILS
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EUR = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
const EUR0 = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const eur = v => EUR.format(v||0), eur0 = v => EUR0.format(v||0);
const sgn = (v,f=eur) => (v>0?"+ ":v<0?"− ":"") + f(Math.abs(v));
const pad = n => String(n).padStart(2,"0");
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const mkOf = d => d.slice(0,7);
const addM = (mk,n) => { let [y,m]=mk.split("-").map(Number); m+=n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return y+"-"+pad(m); };
const mLabel = mk => { const [y,m]=mk.split("-").map(Number); const s=new Date(y,m-1,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"}); return s[0].toUpperCase()+s.slice(1); };
const mShort = mk => { const [y,m]=mk.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("fr-FR",{month:"short"}).replace(".",""); };
const dFr = d => d? d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4) : "";
const dayLabel = d => { const [y,m,j]=d.split("-").map(Number); return new Date(y,m-1,j).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}); };
const lastDay = mk => { const [y,m]=mk.split("-").map(Number); return new Date(y,m,0).getDate(); };
const parseAmt = s => { const n=parseFloat(String(s).replace(/\s/g,"").replace(",",".")); return isFinite(n)?Math.round(n*100)/100:NaN; };
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
let toastT; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  ops:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>',
  pat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg>',
  ana:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  bud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 5"/></svg>',
  acc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',
  set:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  prev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>',
  next:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5 9-10"/></svg>'
};

/* =====================================================================
   STOCKAGE : Firebase (synchro) ou local (test)
   ===================================================================== */
const Store = {
  mode:"local", user:null, db:null, ref:null,
  async init(onReady){
    if (FIREBASE_CONFIG && window.firebase){
      this.mode="firebase";
      firebase.initializeApp(FIREBASE_CONFIG);
      this.db=firebase.firestore();
      try{ await this.db.enablePersistence({synchronizeTabs:true}); }catch(e){}
      firebase.auth().getRedirectResult().catch(e=>toast("Connexion impossible : "+(e.message||e.code)));
      firebase.auth().onAuthStateChanged(async u=>{
        if(!u){ this.user=null; renderLogin(); return; }
        if(ALLOWED_EMAIL && u.email!==ALLOWED_EMAIL){ await firebase.auth().signOut(); renderLogin("Ce compte Google n'est pas autorisé. Connecte-toi avec "+ALLOWED_EMAIL+"."); return; }
        this.user=u; this.ref=this.db.collection("users").doc(u.uid);
        this.listen(onReady);
      });
    } else {
      this.mode="local";
      let s=null,m={};
      try{ s=JSON.parse(localStorage.getItem("mf_settings")||"null"); m=JSON.parse(localStorage.getItem("mf_months")||"{}"); }catch(e){}
      state.settings=s; state.months=m||{}; onReady();
    }
  },
  listen(onReady){
    let gotS=false, gotM=false;
    const done=()=>{ if(gotS&&gotM) onReady(); };
    this.ref.onSnapshot(snap=>{ state.settings=snap.exists?snap.data():null; gotS=true; done(); if(state.ready) render(); }, e=>toast("Lecture impossible : "+e.message));
    this.ref.collection("months").onSnapshot(q=>{ const m={}; q.forEach(d=>{ m[d.id]=(d.data().items)||[]; }); state.months=m; gotM=true; done(); if(state.ready) render(); }, e=>toast("Lecture impossible : "+e.message));
  },
  queue:Promise.resolve(),
  run(fn){ this.queue=this.queue.then(fn).catch(e=>toast("Enregistrement impossible : "+(e.message||e))); return this.queue; },
  saveSettings(){
    const s=clone(state.settings);
    if(this.mode==="local"){ try{ localStorage.setItem("mf_settings",JSON.stringify(s)); }catch(e){ toast("Stockage local plein"); } return; }
    this.run(()=>this.ref.set(s));
  },
  saveMonth(mk){
    const items=clone(state.months[mk]||[]);
    if(this.mode==="local"){ try{ localStorage.setItem("mf_months",JSON.stringify(state.months)); }catch(e){ toast("Stockage local plein"); } return; }
    this.run(()=> items.length ? this.ref.collection("months").doc(mk).set({items}) : this.ref.collection("months").doc(mk).delete());
  },
  async replaceAll(settings, months){
    state.settings=settings; state.months=months;
    if(this.mode==="local"){ localStorage.setItem("mf_settings",JSON.stringify(settings)); localStorage.setItem("mf_months",JSON.stringify(months)); return; }
    await this.ref.set(clone(settings));
    const col=this.ref.collection("months");
    const old=await col.get();
    for(const d of old.docs){ if(!months[d.id]) await d.ref.delete(); }
    for(const [mk,items] of Object.entries(months)){ await col.doc(mk).set({items}); }
  }
};
function signIn(){
  const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({login_hint:ALLOWED_EMAIL||"",prompt:"select_account"});
  firebase.auth().signInWithPopup(p).catch(e=>{ if(/popup/i.test(e.code||"")) firebase.auth().signInWithRedirect(p); else toast("Connexion impossible : "+e.message); });
}

/* =====================================================================
   ÉTAT
   ===================================================================== */
const TABS=["home","ops","budget","patri","analyse","settings"];
const state={ ready:false, settings:null, months:{}, tab:(TABS.includes(location.hash.slice(1))?location.hash.slice(1):"home"),
  month:mkOf(todayISO()), budSeg:"mois", form:{kind:"dep"}, editId:null, editMk:null, filter:{cat:"",q:"",acc:"",neu:false,kind:""}, confirm:null,
  editRec:null, editCredit:null, editAcc:null, importPreview:null, patSeg:"comptes", editCard:false, avOpen:{}, opOpen:{}, avJust:{}, avDebit:null, avCard:null, reco:null, opsTab:"saisir", cardFilter:null, payeOpen:false };

const S=()=>state.settings;
const cats=()=>S().cats;
const catById=id=>cats().find(c=>c.id===id);
const catName=id=>(catById(id)||{name:"Sans catégorie"}).name;
const catColor=id=>(catById(id)||{color:"#64748B"}).color;
const kindOf=id=>(catById(id)||{kind:"dep"}).kind;
const opsOf=mk=>state.months[mk]||[];
const allMonths=()=>Object.keys(state.months).sort();
const nowMk=()=>mkOf(todayISO());

/* =====================================================================
   CALCULS
   ===================================================================== */
const isLateSalary=o=>((o.cat==="rev"&&(o.sub==="Salaire"||o.sub==="Primes & commissions"))||o.cat==="imp")&&Number(o.d.slice(8))>=25;
const isCardLate=o=>!!o.card&&o.amt<0&&Number(o.d.slice(8))>=20&&!isLateSalary(o);   // carte différée : à partir du 20, débité le mois suivant
const shiftNext=o=>isLateSalary(o)||isCardLate(o);
function budgetOps(mk){ // mois budgétaire : paie du mois précédent + achats carte débités ce mois-ci
  return opsOf(mk).filter(o=>!shiftNext(o)).concat(opsOf(addM(mk,-1)).filter(shiftNext)).filter(o=>o.health!=="avance"); // avance remboursable : neutre tant que non remboursée
}
function totals(mk){
  const r={rev:0,dep:0,quot:0,fix:0,creRemb:0,creEmp:0,epa:0,byCat:{},bySub:{},quotByCat:{},quotBySub:{}};
  for(const o of budgetOps(mk)){
    const k=kindOf(o.cat);
    if(k==="neu") continue;
    if(k==="rev"){ r.rev+=o.amt; continue; }
    if(k==="epa"){ r.epa+=o.amt; continue; }
    if(k==="cre"){ if(o.amt<0) r.creRemb+=o.amt; else r.creEmp+=o.amt; continue; }
    r.dep+=o.amt; r.byCat[o.cat]=(r.byCat[o.cat]||0)+o.amt;
    const sk=o.cat+"/"+(o.sub||""); r.bySub[sk]=(r.bySub[sk]||0)+o.amt;
    if(o.fixed) r.fix+=o.amt; else { r.quot+=o.amt; r.quotByCat[o.cat]=(r.quotByCat[o.cat]||0)+o.amt; r.quotBySub[sk]=(r.quotBySub[sk]||0)+o.amt; }
  }
  r.sorties=r.dep+r.creRemb;           // négatif
  r.solde=r.rev+r.dep+r.creRemb;      // hors épargne, emprunts et neutres
  return r;
}
function recActive(r,mk){
  if(r.once) return r.once===mk;
  if(r.start && mk<r.start) return false;
  if(r.end && mk>r.end) return false;
  if(r.months && r.months.length && !r.months.includes(Number(mk.slice(5)))) return false;
  return true;
}
// salaire fixe avant impôt attendu : moyenne des 3 derniers bulletins ordinaires (on écarte les mois exceptionnels, ex. congés payés)
function fixeAuto(){
  const P=S().payslips||{}, ks=Object.keys(P).sort().slice(-6); const v=ks.map(k=>({k,s:paieParts(P[k]).sal})).filter(x=>x.s>0);
  if(v.length<2) return null; const med=v.map(x=>x.s).sort((a,b)=>a-b)[Math.floor(v.length/2)];
  const ok=v.filter(x=>x.s<=med*1.1&&x.s>=med*0.8).slice(-3); if(!ok.length) return null;
  return Math.round(ok.reduce((a,x)=>a+x.s,0)/ok.length);
}
function netFixeNow(){ const m=Number(S().prefs.netFixeManual||0); if(m>0) return m; const a=fixeAuto(); return a!=null?a:Number(S().prefs.netFixe||0); }
function recAmount(r,mk){ if(r.id==="salairefixesyn30"){ const n=netFixeNow(); if(n>0) return n; } return (r.end===mk && r.lastAmt!=null) ? r.lastAmt : r.amt; }
function recStatus(mk,budget){
  const used=new Set(); const out=[];
  const ops=budget?budgetOps(mk):opsOf(mk);
  for(const r of (S().recurring||[])){
    const late=budget&&((kindOf(r.cat)==="rev"&&(r.day||1)>=25)||(r.card&&kindOf(r.cat)!=="rev"&&(r.day||1)>=20));   // salaire de fin de mois : il finance le mois suivant
    const rm=late?addM(mk,-1):mk;
    if(!recActive(r,mk)) continue;
    const amt=recAmount(r,rm);
    const tol=Math.max(2,Math.abs(amt)*0.12);
    const rx=r.match?new RegExp(r.match,"i"):null;
    const m=ops.find(o=>!used.has(o.id) && (o.recId===r.id || (rx && rx.test(o.label) && Math.sign(o.amt)===Math.sign(amt)))) ||
            ops.find(o=>!used.has(o.id) && !o.recId && (!rx||rx.test(o.label)) && o.cat===r.cat && (o.sub||"")===(r.sub||"") && Math.abs(o.amt-amt)<=tol);
    // paie : si le salaire du mois est arrivé (paye saisie ou bulletin déposé), la rentrée prévue est réglée, quel que soit le montant
    const mm=m||((kindOf(r.cat)==="rev"&&r.sub==="Salaire"&&(r.day||1)>=25)?ops.find(o=>!used.has(o.id)&&o.amt>0&&o.cat==="rev"&&o.sub==="Salaire"&&(o.paieOf||o.todoPaie||Number(o.d.slice(8))>=25)):null);
    if(mm) used.add(mm.id);
    out.push({r,amt,paid:!!mm,op:mm,date:rm+"-"+pad(Math.min(r.day||1,lastDay(rm)))});
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function fixedPlan(mk,budget){ // charges fixes prévues du mois (récurrences sorties)
  const st=recStatus(mk,budget); let total=0,paid=0;
  for(const x of st){ if(x.amt<0){ total+=x.amt; if(x.paid) paid+=x.amt; } }
  return {total,paid,list:st};
}
function cardCycle(mk){ // achats carte débités à la fin du mois mk (du 20 du mois précédent au 19)
  const from=addM(mk,-1)+"-20", to=mk+"-19"; let v=0, n=0;
  for(const m of [addM(mk,-1),mk]) for(const o of opsOf(m)) if(o.card&&o.d>=from&&o.d<=to){ v+=o.amt; n++; }
  const bank=((S().prefs||{}).cardBank||{})[mk];
  return {calc:Math.round(v*100)/100, bank:(bank==null?null:Number(bank)), val:(bank==null?Math.round(v*100)/100:Number(bank)), n, from, to};
}
function cardSettled(mk){ return opsOf(mk).some(o=>o.sub==="Règlement carte"&&Number(o.d.slice(8))>=24); }
const GROUPS={ess:"Essentiel",non:"Non essentiel",det:"Dettes",epa:"Épargne & investissement"};
const GCOL={ess:"#7CA8FF",non:"#FFB86B",det:"#FF7A6B",epa:"#5EEAD4"};
const DEF_ESS=["imp/*","log/*","ali/Supermarché","ali/Hygiène & entretien","ali/Coiffeur","ste/Scolarité","ath/Scolarité","ass/*","abo/Téléphone","san/*","ban/*","div/Imprévus"];
function groupOf(cat,sub){
  const k=kindOf(cat); if(k==="cre") return "det"; if(k==="epa") return "epa"; if(k!=="dep") return null;
  const gm=S().groupMap||{}; if(gm[cat+"/"+sub]) return gm[cat+"/"+sub];
  return (DEF_ESS.includes(cat+"/"+sub)||DEF_ESS.includes(cat+"/*"))?"ess":"non";
}
function groupTotals(mk){
  const g={rev:0,ess:0,non:0,det:0,epa:0};
  for(const o of budgetOps(mk)){ const k=kindOf(o.cat);
    if(k==="rev"){ g.rev+=o.amt; continue; }
    if(k==="cre"){ if(o.amt<0) g.det-=o.amt; continue; }
    if(k==="epa"){ g.epa-=o.amt; continue; }
    if(k==="dep"){ const gr=groupOf(o.cat,o.sub||""); g[gr]-=o.amt; } }
  return g;
}
// Plafonds par groupe : clé "ess:ali" = la partie Essentiel de la catégorie Alimentation (charges fixes comprises)
// ---- plafonds : clé "ess:ali" (catégorie dans un groupe) ou "ess:ali/Supermarché" (sous-catégorie)
function plafKeyOf(cat,sub){ const g=groupOf(cat,sub||""); if(g!=="ess"&&g!=="non") return null; const P=S().plafonds||{}; const k2=g+":"+cat+"/"+(sub||""); return (k2 in P)?k2:g+":"+cat; }
function plafVal(raw,mk){
  if(raw==null) return null; if(typeof raw==="number") return raw;
  if(raw.auto) return alimAuto(mk).plafond;
  if(raw.autoTax){ const ps=(S().payslips||{})[addM(mk,-1)]; if(ps) return r2(ps.pas); return Math.round(Number(S().prefs.pasRate||0.095)*(netFixeNow()+commsOf(addM(mk,-1),false))); }
  if(raw.m&&raw.m[mk]!=null) return Number(raw.m[mk]);
  if(raw.end&&mk>raw.end) return 0; if(raw.start&&mk<raw.start) return 0;
  if(raw.months&&!raw.months.includes(Number(mk.slice(5)))) return 0;
  return Number(raw.v||0);
}
function keyLabel(k){ const [g,rest]=k.split(":"); const [c,sb]=rest.split("/"); if(sb) return sb==="Supermarché"?"Courses alimentaires":sb;
  const cat=catById(c); if(!cat) return c; const mine=cat.subs.filter(x=>groupOf(c,x)===g&&!((S().plafonds||{})[g+":"+c+"/"+x]!=null)); if(mine.length&&mine.length<cat.subs.length) return cat.name+" · "+mine.join(", "); return cat.name; }
// ---- planning de Stella → repas à la maison → plafond alimentation
const STELLA_MEALS={mfr:[0,0,0,0,1,2,2],stage:[1,1,1,1,1,2,2],moi:[2,2,2,2,2,2,2],mere:[0,0,0,0,0,0,0]};
function mondayOf(d){ const x=new Date(d+"T12:00:00"); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()); }
function stellaMealsOn(d){
  const st=S().prefs.stella||{}; if(st.days&&st.days[d]!=null) return Number(st.days[d]);
  const w=(st.weeks||{})[mondayOf(d)]||st.def||"mfr"; const x=new Date(d+"T12:00:00"); return (STELLA_MEALS[w]||STELLA_MEALS.mfr)[(x.getDay()+6)%7];
}
function alimAuto(mk){
  const p=S().prefs, n=lastDay(mk); let st=0; for(let i=1;i<=n;i++) st+=stellaMealsOn(mk+"-"+pad(i));
  const moi=2*n, portions=moi+st, prix=Number(p.portion||5.5), titres=Number(p.titres!=null?p.titres:120);
  return {moi,stella:st,portions,prix,titres,plafond:Math.max(0,Math.round(portions*prix-titres))};
}
function planGroups(mk){
  const P=S().plafonds||{}; const out={ess:{},non:{}};
  const mkx=k=>{ const [g]=k.split(":"); if(!out[g]) return null; return out[g][k]=out[g][k]||{key:k,cat:k.split(":")[1].split("/")[0],plaf:null,auto:false,spent:0,fixTodo:0,todo:[]}; };
  for(const [k,raw] of Object.entries(P)){ if(!k.includes(":")) continue; const x=mkx(k); if(!x||!catById(x.cat)) { if(x) delete out[k.split(":")[0]][k]; continue; } x.plaf=plafVal(raw,mk); x.auto=!!(raw&&raw.auto); }
  for(const o of budgetOps(mk)){ if(kindOf(o.cat)!=="dep") continue; const k=plafKeyOf(o.cat,o.sub); if(k){ const x=mkx(k); if(x) x.spent-=o.amt; } }
  for(const x of fixedPlan(mk,true).list){ if(x.paid||x.amt>=0||kindOf(x.r.cat)!=="dep") continue; const k=plafKeyOf(x.r.cat,x.r.sub); if(!k) continue; const y=mkx(k); if(!y) continue; y.fixTodo-=x.amt; y.todo.push(x); }
  const res={};
  for(const g of ["ess","non"]){ const list=Object.values(out[g]).filter(x=>(x.plaf||0)>0||x.spent||x.fixTodo||x.auto||x.plaf===0&&false).sort((a,b)=>(b.plaf||0)-(a.plaf||0)||b.spent-a.spent);
    res[g]={list,plaf:list.reduce((a,x)=>a+(x.plaf||0),0),spent:list.reduce((a,x)=>a+x.spent,0),todo:list.reduce((a,x)=>a+x.fixTodo,0),zero:Object.values(out[g]).filter(x=>!list.includes(x))}; }
  let ds=debtState(mk===nowMk()?todayISO():mk+"-"+pad(lastDay(mk)));
  if(mk>nowMk()) ds=Object.assign({},ds,{payDone:0,capDone:0,intDone:0,pctM:0});
  else if(mk===nowMk()){ const real=-budgetOps(mk).filter(o=>o.cat==="cre"&&o.amt<0).reduce((a,o)=>a+o.amt,0); const r=Math.round(Math.max(0,Math.min(ds.pay,real))*100)/100; const k=ds.payDone>0?r/ds.payDone:0; ds=Object.assign({},ds,{payDone:r,capDone:ds.capDone*k,intDone:ds.intDone*k}); }
  res.det={plaf:ds.pay,spent:ds.payDone,todo:ds.pay-ds.payDone,ds};
  let epa=0; for(const o of budgetOps(mk)) if(kindOf(o.cat)==="epa") epa-=o.amt;
  res.epa={plaf:plafVal(P["epa"],mk)||0,spent:epa,todo:0};
  res.total=res.ess.plaf+res.non.plaf+res.det.plaf+res.epa.plaf;
  return res;
}
// ---- commissions prévues
function commNet(c){ return c.net!=null?Number(c.net):Math.round(Number(c.brut||0)*Number(S().prefs.commRatio||0.75)); }
function cRates(){ const p=S().prefs||{}; return {lr:p.commLic!=null?Number(p.commLic):1, lm:p.commLicM!=null?Number(p.commLicM):1, os:p.commOS!=null?Number(p.commOS):0.04, lag:p.commLag!=null?Number(p.commLag):1, net:Number(p.commRatio||0.75)}; }
function lineBrut(l){ const R=cRates(); if(Number(l.brut)>0) return r2(Number(l.brut)); return r2(Number(l.lic||0)*R.lr*R.lm+Number(l.os||0)*R.os); }
function linePaie(l){ return l.mk?addM(l.mk,cRates().lag):""; }
function dealLines(){ const out=[]; for(const d of (S().deals||[])) for(const l of (d.lines||[])) out.push({d,l,brut:lineBrut(l),paie:linePaie(l)}); return out; }
function dealComm(mk,withProb){ const R=cRates(); if(paieRecue(mk)) return 0; return Math.round(dealLines().filter(x=>x.paie===mk&&(withProb||(x.d.signed&&x.l.locked))).reduce((a,x)=>a+x.brut*R.net,0)); }
function commsOf(mk,withProbable){ return (S().commissions||[]).filter(c=>c.paie===mk&&!c.recu&&(c.sure||withProbable)).reduce((a,c)=>a+commNet(c),0)+dealComm(mk,withProbable); }
// ---- projection : solde juste après chaque paie
function paieRecue(mk){ return opsOf(mk).some(o=>o.cat==="rev"&&o.sub==="Salaire"&&Number(o.d.slice(8))>=25); }
function projection(n,withProbable){
  const m0=nowMk(), cc=S().accounts.find(a=>a.id==="cc"), bal=cc?accBalance(cc)||0:0, netFixe=netFixeNow();
  const G0=planGroups(m0); let rest=0;
  for(const g of ["ess","non"]) for(const x of G0[g].list) rest+=Math.max(0,(x.plaf||0)-x.spent,x.fixTodo);
  rest+=G0.det.todo+Math.max(0,G0.epa.plaf-G0.epa.spent);
  // les achats carte du mois sont déjà dans "spent" mais pas encore débités : on les retire du solde
  let cardPending=0; if(!cardSettled(m0)) cardPending=-cardCycle(m0).val;
  const nd0=paieRecue(m0)?0:ndfDue(m0,true); let B=bal-cardPending-rest+(paieRecue(m0)?0:netFixe+commsOf(m0,withProbable)+nd0);
  const rows=[{mk:m0,B,inc:paieRecue(m0)?0:netFixe+commsOf(m0,withProbable)+nd0,out:G0.total}];
  for(let i=1;i<=n;i++){ const mk=addM(m0,i), G=planGroups(mk), inc=netFixe+commsOf(mk,withProbable)+ndfDue(mk,i===1&&paieRecue(m0)); B=B-G.total+inc; rows.push({mk,B,inc,out:G.total}); }
  return rows;
}
// ---- point bas du mois : prélèvements hors carte avant la paie
function lowPoint(mk,start){
  const today=todayISO(); let v=start, min=start, minD=null; const ev=[];
  for(const x of recStatus(mk)){ if(x.paid||x.amt>=0||x.r.card) continue; if(mk===nowMk()&&x.date<today) continue; const d=Number(x.date.slice(8)); if(d>=lastDay(mk)-1) continue; ev.push({d:x.date,a:x.amt}); }
  ev.sort((a,b)=>a.d.localeCompare(b.d)); for(const e of ev){ v+=e.a; if(v<min){ min=v; minD=e.d; } }
  return {min,date:minD};
}
function bar(ratio){ const over=ratio>1; return `<div class="track" style="height:9px"><i style="width:${Math.min(100,Math.max(0,ratio*100))}%;background:${over?"var(--coral)":"var(--mint)"}"></i></div>`; }
function budgetFor(key){ const b=S().budgets||{}; return (key in b)?Number(b[key]):null; }
function accBalance(a){
  if(a.balance==null) return null;
  let v=Number(a.balance);
  if(a.type==="courant"){
    for(const mk of allMonths()){ if(mk<mkOf(a.balanceDate||"0000-00")) continue;
      for(const o of opsOf(mk)){ if(o.acc===a.id && o.d>a.balanceDate && (o.sub!=="Règlement carte"||o.manualReg) && !o.imported && !o.card) v+=o.amt; } }

function niceMax(v){ if(v<=0) return 100; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

  const d=points.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");

function cardMk(o){ return isCardLate(o)?addM(mkOf(o.d),1):mkOf(o.d); }
function cardState(o){ if(!(o.card&&o.amt<0)) return null; const cm=cardMk(o); if(cardSettled(cm)||o.debited) return "ok"; return (o.imported||o.bank)?"bank":"saisie"; }
function ndfDue(mk,upTo){ let v=0; for(const m of allMonths()) for(const o of opsOf(m)) if(o.pro&&o.pro.status==="attente"){ const p=o.pro.paie||paieFor(o.d); if(upTo?p<=mk:p===mk) v+=Number(o.pro.remb||-o.amt); } return r2(v); }

function groupUntil(mk,day){ const g={ess:0,non:0}, sub={};
  for(const o of opsOf(mk)){ if(Number(o.d.slice(8))>day||kindOf(o.cat)!=="dep") continue; const gr=groupOf(o.cat,o.sub||""); g[gr]-=o.amt; if(gr==="non"){ const k=o.cat+"/"+(o.sub||""); sub[k]=(sub[k]||0)-o.amt; } }
  return {g,sub}; }
function victory(){
  const today=todayISO(), m0=nowMk(); let mk=m0, day=Number(today.slice(8));
  if(day<5){ mk=addM(m0,-1); day=31; }
  const prev=addM(mk,-1), start=S().prefs.startMonth||"2026-01";
  const hist=[]; for(let m=start;m<mk;m=addM(m,1)) if(opsOf(m).length) hist.push(m);
  const mn=m=>mLabel(m).split(" ")[0].toLowerCase();
  const when=day>=31?"en "+mn(mk):"au "+Number(today.slice(8))+" "+mn(mk);
  const avgLab=hist.length&&hist[0].slice(0,4)===mk.slice(0,4)?"ta moyenne "+mk.slice(0,4):"ta moyenne";
  const cur=groupUntil(mk,day), pv=opsOf(prev).length?groupUntil(prev,day):null, hs=hist.map(m=>groupUntil(m,day));
  const red=(c,ref)=>ref>20?Math.round((1-c/ref)*100):null;
  const avgOf=f=>hs.length?hs.reduce((a,x)=>a+f(x),0)/hs.length:0;
  const tiles=(c,fp,fa)=>{ const t=[]; const a=pv?red(c,fp(pv)):null, b=hs.length?red(c,avgOf(fa)):null; if(a>=10) t.push({pc:a,ref:mn(prev)}); if(b>=10) t.push({pc:b,ref:avgLab}); return t; };
  // 1. groupe Non essentiel
  let t=tiles(cur.g.non,x=>x.g.non,x=>x.g.non);
  if(t.length) return {when,detail:pv?eur(cur.g.non)+" dépensés en non essentiel, contre "+eur(pv.g.non)+" en "+mn(prev)+" à la même date.":"",title:Math.max(...t.map(x=>x.pc))>=50?"Tes dépenses non essentielles ont fondu":"Tes dépenses non essentielles baissent",tiles:t};
  // 2. une sous-catégorie non essentielle
  let best=null; for(const k of new Set(hs.flatMap(x=>Object.keys(x.sub)))){ const av=avgOf(x=>x.sub[k]||0); if(av<40) continue; const r=red(cur.sub[k]||0,av); if(r>=20&&(!best||r>best.r)) best={k,r}; }
  if(best){ const [c,sb]=best.k.split("/"); t=tiles(cur.sub[best.k]||0,x=>x.sub[best.k]||0,x=>x.sub[best.k]||0); return {when,title:"« "+(sb||catName(c))+" » : en nette baisse",tiles:t}; }
  // 3. objectif tenu
  const g=groupTotals(mk), tg=Object.assign({ess:50,non:30,det:20,epa:0},S().prefs.targets||{});
  if(g.rev>0&&g.non/g.rev*100<=tg.non) return {when,title:"Objectif Non essentiel tenu",tiles:[{pc:Math.round(g.non/g.rev*100),ref:"de tes revenus, pour "+tg.non+" % visés",plain:true}]};
  if(pv&&red(pv.g.non,cur.g.non)>=10) return {when,title:"Point d'attention",warn:"Tes dépenses non essentielles montent de "+Math.round((cur.g.non/pv.g.non-1)*100)+" % par rapport à "+mn(prev)+" à la même date ("+eur(cur.g.non)+" contre "+eur(pv.g.non)+"). Regarde ta liste de sorties pour voir où ça part.",tiles:[]};
  return {when,title:"Tu suis tes dépenses jour après jour : c'est comme ça que tout change",tiles:[]};
}

function findCat(phrase){
  const p=norm(phrase).trim(); if(!p) return null;
  for(const c of cats()) for(const sb of c.subs) if(norm(sb)===p) return {cat:c.id,sub:sb};
  for(const c of cats()) if(norm(c.name)===p) return {cat:c.id,sub:c.subs[0]};
  for(const c of cats()) for(const sb of c.subs) if(norm(sb).includes(p)||p.includes(norm(sb))) return {cat:c.id,sub:sb};
  for(const c of cats()) if(norm(c.name).includes(p)||p.includes(norm(c.name))) return {cat:c.id,sub:c.subs[0]};
  for(const [rx,c,sb] of SYN) if(rx.test(p)&&catById(c)) return {cat:c,sub:catById(c).subs.includes(sb)?sb:catById(c).subs[0]};
  return null;
}
function parsePhrase(txt){

  if(/avant[- ]hier/.test(t)){ const d=new Date(); d.setDate(d.getDate()-2); r.d=iso(d); t=t.replace(/avant[- ]hier/," "); }
  else if(/\bhier\b/.test(t)){ const d=new Date(); d.setDate(d.getDate()-1); r.d=iso(d); t=t.replace(/\bhier\b/," "); }
  const md=t.match(new RegExp("\\ble (\\d{1,2})(?:er)?(?: ("+MOIS.join("|")+"))?\\b"));
  if(md){ const day=Number(md[1]); const mo=md[2]?MOIS.indexOf(md[2]):today.getMonth(); let y=today.getFullYear(); if(mo>today.getMonth()+1) y--; r.d=y+"-"+pad(mo+1)+"-"+pad(Math.min(day,31)); t=t.replace(md[0]," "); }
  t=t.replace(/aujourd'?hui/," ");
  // montant
  let m=t.match(/(\d+(?:[.,]\d{1,2})?)\s*euros?(?:\s*(?:et\s*)?(\d{1,2})(?:\s*centimes?)?)?/);
  if(m){ r.amt=parseFloat(m[1].replace(",",".")); if(m[2]&&!/[.,]/.test(m[1])) r.amt+=Number(m[2])/100; }
  else { m=t.match(/(\d+(?:[.,]\d{1,2})?)/); if(m) r.amt=parseFloat(m[1].replace(",",".")); }
  if(r.amt!=null) r.amt=Math.round(r.amt*100)/100;
  // type et moyen de paiement
  if(/\b(revenu|recu|rentree|salaire|gain|prime|commission)\b/.test(t)) r.kind="rev";
  if(/\b(prelevement|virement|especes|liquide|cheque)\b/.test(t)||r.kind==="rev") r.card=false;
  if(/\b(cb|carte)\b/.test(t)) r.card=true;
  // catégorie dite
  const mc=t.match(/categorie\s+(.+?)(?=\s+(?:de \d|pour|en carte|par carte|cb|payee?|a |au |chez )|\s*$)/);
  // libellé (ce qui suit « à » / « chez »)
  const ml=t.match(/\b(?:a|au|aux|chez)\s+(.+?)(?=\s+(?:de \d|d'un|pour|categorie|en carte|par carte|cb|\d+(?:[.,]\d+)?\s*euros?)|\s*$)/);
  if(ml){ const lab=ml[1].trim(); const i=norm(raw).indexOf(lab); r.label=(i>=0?raw.substr(i,lab.length):lab).replace(/^./,c=>c.toUpperCase()); }
  if(mc){ const f=findCat(mc[1]); if(f){ r.cat=f.cat; r.sub=f.sub; } else { const i=norm(raw).indexOf(mc[1].trim()); r.unknown=(i>=0?raw.substr(i,mc[1].trim().length):mc[1]).replace(/^./,c=>c.toUpperCase()); } }
  if(!r.cat){ const f=r.label?autoCat(r.label.toUpperCase(),r.kind==="rev"?1:-1):null; if(f&&f.cat!=="div"&&f.cat!=="neu"){ r.cat=f.cat; r.sub=f.sub; } else { const g=findCat(r.label)||findCat(t.split(" ").find(w=>findCat(w))||""); if(g){ r.cat=g.cat; r.sub=g.sub; } } }
  if(r.cat==="san"&&r.sub==="Remboursements") r.kind="rembt";
  if(!r.cat){ r.cat=r.kind==="rev"?"rev":"div"; r.sub=r.kind==="rev"?"Autres revenus":"Imprévus"; }
  if(!r.label) r.label=r.sub||"Opération";
  return r;
}

  const cellF=(v,avg)=>{ let bg="transparent"; if(avg>=20){ const r=(v-avg)/avg; bg=r>0?`rgba(255,122,107,${Math.min(.55,r*.7).toFixed(2)})`:`rgba(94,234,212,${Math.min(.45,-r*.6).toFixed(2)})`; } return `<td style="background:${bg}">${v?Math.round(v):"·"}</td>`; };
  const trs=rows.map(r=>{ const vd=r.v.slice(0,done.length), avg=vd.reduce((a,x)=>a+x,0)/nd;
    let tend="—",cls="muted"; if(vd.length>=6){ const f3=vd.slice(0,3).reduce((a,x)=>a+x,0)/3, l3=vd.slice(-3).reduce((a,x)=>a+x,0)/3; if(f3>20){ const t=(l3/f3-1)*100; tend=(t>0?"+":t<0?"−":"")+Math.abs(Math.round(t))+" %"; cls=t<=0?"pos":"neg"; } }
    return `<tr><td>${esc(catName(r.c))}</td>${shown.map((m,i)=>cellF(r.v[off+i],avg)).join("")}<td class="${cls}">${tend}</td></tr>`; }).join("");
  return `<section class="card"><div class="ch"><h2>Mes catégories sur l'année</h2><span class="s">montants par mois · vert = sous ma moyenne, rouge = au-dessus</span></div>
   <div class="ychips"><button class="mchip ${state.anaCatAll?"":"on"}" data-act="ana-cat-all" data-v="0">4 derniers mois</button><button class="mchip ${state.anaCatAll?"on":""}" data-act="ana-cat-all" data-v="1">Toute l'année</button><button class="mchip ${state.anaCatOpen?"on":""}" data-act="ana-cat-open">Choisir les catégories</button></div>
   ${state.anaCatOpen?`<div class="muted" style="font-size:12px">Touche pour ajouter ou retirer une catégorie</div><div class="ychips">${allRows.map(r=>`<button class="mchip ${chosen.includes(r.c)?"on":""}" data-act="ana-cat" data-c="${esc(r.c)}">${chosen.includes(r.c)?"✓ ":"+ "}${esc(catName(r.c))}</button>`).join("")}${state.anaCats?`<button class="mchip" data-act="ana-cat-auto">Remettre le choix automatique</button>`:""}</div>`:""}
   <div class="tbw"><table class="tb"><tr><th></th>${shown.map(m=>`<th>${esc(mShort(m))}${m>=cur?" *":""}</th>`).join("")}<th>Tendance</th></tr>${trs}</table></div>
   <p class="muted" style="font-size:12px;margin:6px 0 0">Sans choix de ta part, je te montre tes 9 plus grosses catégories hors charges fixes. Tendance = tes efforts : moyenne des 3 derniers mois terminés comparée à celle des 3 premiers mois de l'année. En vert, ça baisse. La moyenne ne compte que les mois terminés${ms.some(m=>m>=cur)?" ; * = mois en cours":""}.</p></section>`;
}

   ${sel.map(y=>`<div class="row"><div class="t"><b>${y}</b><small>${N} premières paies</small></div><span class="a">${eur0(tot(y))}</span></div>`).join("")}</section>`;
}

function multiLine(series,months){
  const W=640,H=200,L=40,R=12,T=12,B=26,iw=W-L-R,ih=H-T-B;
  const mx=Math.max(100,...series.flatMap(s=>s.v)); const x=i=>L+(months.length<2?iw/2:iw*i/(months.length-1)), y=v=>T+ih-ih*Math.min(v,mx)/mx;
  let g=""; for(let i=0;i<=4;i++){ const v=mx*i/4; g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1C2742"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#5F6B85">${Math.round(v)} %</text>`; }
  months.forEach((m,i)=>{ if(months.length<=10||i%2===0||i===months.length-1) g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="#5F6B85">${mShort(m)}</text>`; });
  for(const s of series){ g+=`<path d="${s.v.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round"/>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la répartition">${g}</svg>`;
}
function grpOps(mk,k){
  return budgetOps(mk).filter(o=>{ const kk=kindOf(o.cat);
    if(k==="det") return kk==="cre"&&o.amt<0; if(k==="epa") return kk==="epa";
    return kk==="dep"&&groupOf(o.cat,o.sub||"")===k; }).sort((a,b)=>b.d.localeCompare(a.d)||a.amt-b.amt);
}
function grpList(mk,k,fut){
  const ops=grpOps(mk,k);
  const bySub={}; for(const o of ops){ const key=catName(o.cat)+" › "+(o.sub||""); bySub[key]=(bySub[key]||0)-o.amt; }
  const subs=Object.entries(bySub).sort((a,b)=>b[1]-a[1]);
  let h=`<div style="margin:10px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)">`;
  if(subs.length) h+=`<div class="muted" style="font-size:12px;margin-bottom:4px">Par sous-catégorie</div>`+subs.map(([n,v])=>`<div class="row" style="padding:4px 0;border:0"><div class="t"><b style="font-weight:500;font-size:13px">${esc(n)}</b></div><span class="a" style="font-size:13px">${eur(v)}</span></div>`).join("");
  if(fut&&fut.length) h+=`<div class="muted" style="font-size:12px;margin:10px 0 4px">À venir ce mois-ci</div>`+fut.map(x=>`<div class="row" style="padding:5px 0"><div class="t"><b style="font-weight:500;font-size:13px">${esc(x.r.label)}</b><small><span style="color:var(--amber)">prévu le ${esc(dFr(x.date))}</span> · ${esc(x.r.sub||"")}</small></div><span class="a" style="font-size:13px">${sgn(x.amt)}</span></div>`).join("");
  h+=`<div class="muted" style="font-size:12px;margin:10px 0 4px">Opérations (${ops.length})</div>`;
  h+=ops.length?ops.map(o=>`<div class="row" style="padding:5px 0"><div class="t"><b style="font-weight:500;font-size:13px">${esc(o.label)}${o.card?'<span class="tag">CB</span>':""}</b><small>${esc(dFr(o.d))} · ${esc(catName(o.cat))} · ${esc(o.sub||"")}</small></div><span class="a ${o.amt>0?"pos":""}" style="font-size:13px">${sgn(o.amt)}</span></div>`).join(""):`<p class="muted" style="font-size:13px;margin:4px 0">Aucune opération.</p>`;
  return h+`</div>`;
}
function vGroups(mk,start){
  const g=groupTotals(mk), tg=Object.assign({ess:50,non:30,det:20,epa:0},S().prefs.targets||{});
  const R=g.rev;
  // prévisionnel : prélèvements fixes du mois pas encore passés (Etalis, Franfinance, abonnements…)
  const fut={ess:0,non:0,det:0,epa:0}, futL={ess:[],non:[],det:[],epa:[]}; let nFut=0;
  if(mk>=nowMk()) for(const x of recStatus(mk)){ if(x.paid||x.amt>=0) continue; const k=kindOf(x.r.cat);
    const gr=k==="cre"?"det":k==="epa"?"epa":k==="dep"?groupOf(x.r.cat,x.r.sub||""):null; if(gr){ fut[gr]-=x.amt; futL[gr].push(x); nFut++; } }
  const tip=k=>futL[k].length?"À venir ce mois-ci :\n"+futL[k].map(x=>"• "+x.r.label+" : "+eur(-x.amt)+" le "+dFr(x.date)).join("\n")+"\nTotal : "+eur(fut[k]):"Rien d'autre de prévu ce mois-ci";
  const tipAll="À venir ce mois-ci : "+eur(Object.values(fut).reduce((a,v)=>a+v,0))+"\n"+["ess","non","det","epa"].filter(k=>fut[k]).map(k=>"• "+GROUPS[k]+" : "+eur(fut[k])).join("\n");
  const hasFut=nFut>0;
  const rows=["ess","non","det","epa"].map(k=>{ const v=k==="epa"?Math.max(0,g.epa):g[k]; const vt=v+fut[k]; return {k,v,vt,pc:R>0?v/R*100:0,pt:R>0?vt/R*100:0,t:Number(tg[k]||0)}; });
  const used=rows.reduce((a,r)=>a+r.v,0), usedT=rows.reduce((a,r)=>a+r.vt,0);
  const bad=(k,pc,t)=>(k==="ess"||k==="non")?pc>t:pc<t;
  let h=`<section class="card"><div class="ch"><h2>Répartition de mes sorties</h2><span class="s">en % des ${eur0(R)} reçus pour ${esc(mLabel(mk).toLowerCase())} · cible ${tg.ess}/${tg.non}/${tg.det}/${tg.epa}</span></div>
   ${hasFut?`<p class="muted" style="font-size:12.5px;margin:0 0 8px">Barre pleine : à date. Partie hachurée : prélèvements encore à passer ce mois-ci (${nFut}). Survole une barre pour le détail, clique sur un groupe pour voir ses dépenses.</p>`:`<p class="muted" style="font-size:12.5px;margin:0 0 8px">Clique sur un groupe pour voir ses dépenses.</p>`}
   ${rows.map(r=>{ const pcs=hasFut?`à date <b style="color:${bad(r.k,r.pc,r.t)?"var(--coral)":"var(--mint)"}">${Math.round(r.pc)} %</b> · à terme <b style="color:${bad(r.k,r.pt,r.t)?"var(--coral)":"var(--mint)"}">${Math.round(r.pt)} %</b>`:`<b style="color:${bad(r.k,r.pc,r.t)?"var(--coral)":"var(--mint)"}">${Math.round(r.pc)} %</b>`;
     const open=state.grpOpen===r.k;
     return `<div class="gauge" ${hasFut?`title="${esc(tip(r.k))}"`:""}><div class="h" data-act="grp-toggle" data-k="${r.k}" style="cursor:pointer" role="button" aria-expanded="${open}"><b><span style="display:inline-block;width:12px;color:var(--muted);font-size:11px">${open?"▾":"▸"}</span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${GCOL[r.k]};margin-right:7px"></span>${GROUPS[r.k]}</b><span class="muted num" style="font-size:12px">cible ${r.t} %</span></div>
     <div class="h" style="margin-top:2px"><span class="num" style="font-size:12.5px">${eur0(r.v)}${hasFut&&r.vt!==r.v?` → ${eur0(r.vt)}`:""}</span><span class="num" style="font-size:12.5px">${pcs}</span></div>
     <div class="track" style="position:relative;display:flex"><i style="width:${Math.min(100,r.pc)}%;background:${GCOL[r.k]};border-radius:6px 0 0 6px"></i>${hasFut&&r.pt>r.pc?`<i style="width:${Math.max(0,Math.min(100,r.pt)-Math.min(100,r.pc))}%;background:repeating-linear-gradient(45deg,${GCOL[r.k]} 0 3px,transparent 3px 6px);opacity:.8;border-radius:0"></i>`:""}<span style="position:absolute;top:-3px;left:calc(${Math.min(100,r.t)}% - 1px);width:2px;height:14px;background:var(--ink);opacity:.7"></span></div>${open?grpList(mk,r.k,futL[r.k]):""}</div>`; }).join("")}
   ${g.epa<0?`<p class="muted" style="font-size:12.5px;margin:8px 0 0">Ce mois-ci, tu as repris ${eur0(-g.epa)} sur ton épargne.</p>`:""}
   <div class="row" style="margin-top:6px"><div class="t"><b>${R-used>=0?"Reste à date":"Dépassement à date"}</b><small>revenus − les 4 groupes</small></div><span class="a ${R-used<0?"neg":"pos"}">${sgn(R-used)}</span></div>
   ${hasFut?`<div class="row" title="${esc(tipAll)}"><div class="t"><b>${R-usedT>=0?"Reste à terme":"Dépassement à terme"}</b><small>après les prélèvements à venir</small></div><span class="a ${R-usedT<0?"neg":"pos"}">${sgn(R-usedT)}</span></div>`:""}</section>`;
  const hRep=h; h="";
  const ms0=[]; for(let m=start;m<=mk;m=addM(m,1)) ms0.push(m);
  const ms=ms0.filter(m=>groupTotals(m).rev>=netFixeNow()*0.5); // on écarte les mois sans salaire complet (ex. janvier : salaire de décembre absent)
  if(ms.length>1){ const data=ms.map(m=>groupTotals(m));
    const ser=["ess","non","det","epa"].map(k=>({color:GCOL[k],v:data.map(d=>d.rev>0?Math.max(0,(k==="epa"?Math.max(0,d.epa):d[k]))/d.rev*100:0)}));
    h+=`<section class="card"><div class="ch"><h2>Évolution de la répartition</h2><div class="legend">${["ess","non","det","epa"].map(k=>`<span><i style="background:${GCOL[k]}"></i>${GROUPS[k]}</span>`).join("")}</div></div>${multiLine(ser,ms)}<p class="muted" style="font-size:12px;margin:6px 0 0">En % des revenus de chaque mois (de salaire à salaire). L'objectif : voir la part Dettes baisser et la part Épargne monter.</p></section>`; }
  return {rep:hRep,evo:h};
}

/* ---------- AMORTISSEMENT DES CRÉDITS ---------- */
function addMd(d,n){ const mk=addM(d.slice(0,7),n); return mk+"-"+pad(Math.min(Number(d.slice(8)),lastDay(mk))); }
const r2=v=>Math.round(v*100)/100;
function crSchedule(c){ // échéances à partir de c.next ; c.crd = restant dû juste avant c.next
  const out=[]; let crd=Number(c.crd); const m=Number(c.mens)||0; if(!(crd>0)||!c.next||!m) return out;
  const r=Number(c.rate||0)/1200; let d=c.next;
  for(let i=0;i<600&&crd>0.005;i++){ const it=r2(crd*r); const cap=r2(Math.min(crd,m-it)); if(cap<=0) break; crd=r2(crd-cap); out.push({d,int:it,cap,pay:r2(it+cap),after:crd}); d=addMd(d,1); }
  return out;
}
function crPrev(c){ // échéance juste avant c.next, reconstituée
  if(!c.next||!(Number(c.crd)>=0)||!Number(c.mens)) return null;
  const r=Number(c.rate||0)/1200, m=Number(c.mens); const d=addMd(c.next,-1); if(c.since&&d<c.since) return null;
  const before=r2((Number(c.crd)+m)/(1+r)); const it=r2(before*r); return {d,int:it,cap:r2(m-it),pay:m,before};
}
function crdAt(c,date){ let v=Number(c.crd)||0; for(const x of crSchedule(c)) if(x.d<=date) v=x.after; return v; }
function crPaysIn(c,mk){ const l=crSchedule(c).filter(x=>x.d.slice(0,7)===mk); const pv=crPrev(c); if(pv&&pv.d.slice(0,7)===mk) l.unshift(pv); return l; }
function crNext(c,date){ return crSchedule(c).find(x=>x.d>date)||null; }
function debtState(date){
  const cr=S().credits||[]; const base=Number((S().prefs.debtStart||{}).total)||0; const mk=date.slice(0,7);
  const now=cr.reduce((a,c)=>a+crdAt(c,date),0);
  let pay=0,cap=0,int=0,capDone=0,intDone=0,payDone=0;
  for(const c of cr) for(const x of crPaysIn(c,mk)){ pay+=x.pay; cap+=x.cap; int+=x.int; if(x.d<=date){ capDone+=x.cap; intDone+=x.int; payDone+=x.pay; } }
  return {base,now,pct:base>0?Math.max(0,(base-now)/base*100):0,pctM:base>0?capDone/base*100:0,pay,cap,int,capDone,intDone,payDone};
}

function catListHtml(){
  const ce=state.catOp||{}; const SYS=["rev","cre","epa","neu"]; const q=(state.catQ||"").trim().toLowerCase(), F=state.catF||"all";
  const subTargets=(exCat,exSub)=>cats().filter(c=>c.kind!=="neu").map(c=>`<optgroup label="${esc(c.name)}">${c.subs.filter(x=>!(c.id===exCat&&x===exSub)).map(x=>`<option value="${c.id}|${esc(x)}">${esc(x)}</option>`).join("")}</optgroup>`).join("");
  let h="";
  const kindOk=c=>F==="all"||(F==="ce"?(c.kind==="cre"||c.kind==="epa"):c.kind===F);

  for(const c of cats()){
    if(!kindOk(c)) continue;
    const nameHit=!q||c.name.toLowerCase().includes(q), subHit=!!q&&c.subs.some(x=>x.toLowerCase().includes(q)); if(!nameHit&&!subHit) continue; shown++;
    const isDep=c.kind==="dep"; const open=!!(state.catOpen||{})[c.id]||ce.cat===c.id||(!!q&&subHit);
    h+=`<div id="cat-${c.id}" style="border-bottom:1px solid var(--line)"><div class="row" data-act="cat-tog" data-cat="${c.id}" role="button" aria-expanded="${open}" style="border:0;padding:12px 0;cursor:pointer"><span class="bar4" style="background:${c.color}"></span><div class="t"><b>${esc(c.name)}</b><small>${({dep:"Dépense",rev:"Revenu",cre:"Crédits",epa:"Épargne",neu:"Neutre"})[c.kind]} · ${c.subs.length} sous-catégorie${c.subs.length>1?"s":""}</small></div><span class="muted" style="font-size:16px">${open?"▾":"▸"}</span></div>`;
    if(!open){ h+=`</div>`; continue; }
    h+=`<div class="toolbar" style="margin:0 0 6px 14px"><button class="btn sm" data-act="cat-op" data-op="addSub" data-cat="${c.id}">+ sous-cat.</button><button class="ibtn" data-act="cat-op" data-op="renCat" data-cat="${c.id}" aria-label="Renommer">${ICON.edit}</button>${SYS.includes(c.id)?"":`<button class="ibtn" data-act="cat-op" data-op="delCat" data-cat="${c.id}" aria-label="Supprimer">${ICON.del}</button>`}</div>`;
    if(ce.cat===c.id&&!ce.sub){
      if(ce.op==="addSub"||ce.op==="renCat") h+=`<div class="toolbar" style="margin:6px 0 6px 14px"><input class="in grow" id="co-name" value="${ce.op==="renCat"?esc(c.name):""}" placeholder="${ce.op==="addSub"?"Nouvelle sous-catégorie":"Nom de la catégorie"}">${ce.op==="renCat"&&!SYS.includes(c.id)?`<select class="in" id="co-kind" style="width:auto"><option value="dep" ${isDep?"selected":""}>Dépense</option><option value="rev" ${c.kind==="rev"?"selected":""}>Revenu</option></select>`:""}<button class="btn sm pri" data-act="cat-save">Valider</button><button class="btn sm" data-act="cat-cancel">Annuler</button></div>`;
      if(ce.op==="delCat") h+=`<div class="banner warn" style="margin:6px 0 6px 14px"><div class="grow">Supprimer « ${esc(c.name)} » ? Ses opérations iront dans :</div><select class="in" id="co-target" style="width:auto">${subTargets(c.id,null).replace(new RegExp('<optgroup label="'+esc(c.name).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+'">.*?</optgroup>'),"")}</select><button class="btn sm danger" data-act="cat-save">Supprimer</button><button class="btn sm" data-act="cat-cancel">Annuler</button></div>`;
    }
    for(const sb of ((q&&!nameHit)?c.subs.filter(x=>x.toLowerCase().includes(q)):c.subs)){
      const gr=isDep?groupOf(c.id,sb):null;
      h+=`<div class="row" style="padding:5px 0 5px 14px;border:0"><div class="t"><b style="font-weight:500;font-size:13.5px">${esc(sb)}</b></div>
        ${isDep?`<select class="in" data-group="${c.id}|${esc(sb)}" style="width:auto;height:32px;font-size:12px;padding:0 4px" aria-label="Groupe">${["ess","non"].map(k=>`<option value="${k}" ${gr===k?"selected":""}>${k==="ess"?"Essentiel":"Non ess."}</option>`).join("")}</select>`:""}
        <button class="ibtn" data-act="cat-op" data-op="renSub" data-cat="${c.id}" data-sub="${esc(sb)}" aria-label="Renommer">${ICON.edit}</button>
        <button class="ibtn" data-act="cat-op" data-op="moveSub" data-cat="${c.id}" data-sub="${esc(sb)}" aria-label="Déplacer" title="Déplacer">⇄</button>
        <button class="ibtn" data-act="cat-op" data-op="delSub" data-cat="${c.id}" data-sub="${esc(sb)}" aria-label="Supprimer">${ICON.del}</button></div>`;
      if(ce.cat===c.id&&ce.sub===sb){
        if(ce.op==="renSub") h+=`<div class="toolbar" style="margin:4px 0 8px 28px"><input class="in grow" id="co-name" value="${esc(sb)}"><button class="btn sm pri" data-act="cat-save">Valider</button><button class="btn sm" data-act="cat-cancel">Annuler</button></div>`;
        if(ce.op==="moveSub") h+=`<div class="toolbar" style="margin:4px 0 8px 28px"><span class="muted" style="font-size:13px">Déplacer vers</span><select class="in" id="co-target" style="width:auto">${cats().filter(x=>x.id!==c.id&&x.kind===c.kind).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><button class="btn sm pri" data-act="cat-save">Déplacer</button><button class="btn sm" data-act="cat-cancel">Annuler</button></div>`;
        if(ce.op==="delSub") h+=`<div class="banner warn" style="margin:4px 0 8px 28px"><div class="grow">Supprimer « ${esc(sb)} » ? Ses opérations iront dans :</div><select class="in" id="co-target" style="width:auto">${subTargets(c.id,sb)}</select><button class="btn sm danger" data-act="cat-save">Supprimer</button><button class="btn sm" data-act="cat-cancel">Annuler</button></div>`;
      }
    }
    h+=`</div>`;
  }
  if(!shown) h+=`<p class="muted" style="margin:8px 0">Aucune catégorie ne correspond.</p>`;
  return h;
}
function remapOps(fn){ // fn(op) -> true si modifiée
  for(const mk of allMonths()){ let ch=false; for(const o of opsOf(mk)) if(fn(o)) ch=true; if(ch) Store.saveMonth(mk); }
  for(const r of (S().recurring||[])) fn(r);
}
function catSave(){
  const ce=state.catOp; if(!ce) return; const c=catById(ce.cat); const b=S().budgets||{}; const gm=S().groupMap=S().groupMap||{};
  const val=id=>{ const el=$("#"+id); return el?el.value:""; };
  if(ce.op==="addSub"){ const n=val("co-name").trim(); if(!n) return; if(!c.subs.includes(n)) c.subs.push(n); }
  if(ce.op==="renCat"){ const n=val("co-name").trim(); if(n) c.name=n; const k=val("co-kind"); if(k) c.kind=k; }
  if(ce.op==="renSub"){ const n=val("co-name").trim(); if(!n||n===ce.sub) { state.catOp=null; render(); return; }
    c.subs=c.subs.map(x=>x===ce.sub?n:x).filter((x,i,a)=>a.indexOf(x)===i);
    remapOps(o=>{ if(o.cat===c.id&&o.sub===ce.sub){ o.sub=n; return true; } });
    const k=c.id+"/"+ce.sub; if(k in b){ b[c.id+"/"+n]=b[k]; delete b[k]; } if(gm[k]){ gm[c.id+"/"+n]=gm[k]; delete gm[k]; } }
  if(ce.op==="moveSub"){ const to=catById(val("co-target")); if(!to) return;
    c.subs=c.subs.filter(x=>x!==ce.sub); if(!to.subs.includes(ce.sub)) to.subs.push(ce.sub);
    remapOps(o=>{ if(o.cat===c.id&&o.sub===ce.sub){ o.cat=to.id; return true; } });
    const k=c.id+"/"+ce.sub; if(k in b){ b[to.id+"/"+ce.sub]=b[k]; delete b[k]; } if(gm[k]){ gm[to.id+"/"+ce.sub]=gm[k]; delete gm[k]; } }
  if(ce.op==="delSub"||ce.op==="delCat"){ const [tc,ts]=val("co-target").split("|"); if(!tc) { toast("Choisis où ranger les opérations"); return; }
    const match=o=>o.cat===c.id&&(ce.op==="delCat"||o.sub===ce.sub);
    remapOps(o=>{ if(match(o)){ o.cat=tc; o.sub=ts; return true; } });
    if(ce.op==="delSub"){ if(c.subs.length<=1){ toast("Une catégorie doit garder au moins une sous-catégorie"); return; } c.subs=c.subs.filter(x=>x!==ce.sub); delete b[c.id+"/"+ce.sub]; delete gm[c.id+"/"+ce.sub]; }
    else { S().cats=cats().filter(x=>x.id!==c.id); for(const k of Object.keys(b)) if(k===c.id||k.startsWith(c.id+"/")) delete b[k]; for(const k of Object.keys(gm)) if(k.startsWith(c.id+"/")) delete gm[k]; } }
  state.catOp=null; saveSettings(); render(); toast("Catégories mises à jour");
}

function setMonthOps(mk,list){ state.months[mk]=list; Store.saveMonth(mk); }
function saveSettings(){ Store.saveSettings(); }
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-goto],[data-seg],[data-pseg],[data-optab]"); if(!t) return; if(t.tagName==="A") e.preventDefault();
  if(t.dataset.goto){ go(t.dataset.goto); return; }
  if(t.dataset.optab){ state.opsTab=t.dataset.optab; state.editId=null; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.seg){ state.budSeg=t.dataset.seg; render(); return; }
  if(t.dataset.pseg){ state.patSeg=t.dataset.pseg; state.editAcc=null; render(); return; }
  const a=t.dataset.act;
  if(a!=="ask"&&!String(a).startsWith("del-")&&!a.startsWith("restore")) state.confirm=null;
  switch(a){
    case "login": signIn(); break;
    case "logout": firebase.auth().signOut(); break;
    case "to-pointer": state.opsTab="deb"; go("ops"); break;
    case "paye-tog": state.payeOpen=!state.payeOpen; render(); break;
    case "card-cyc": state.cardFilter=state.cardFilter===t.dataset.mk?null:t.dataset.mk; render(); break;
    case "op-bank": { const o=opsOf(t.dataset.mk).find(x=>x.id===t.dataset.id); if(o){ o.bank=true; Store.saveMonth(t.dataset.mk); render(); toast("Notée : vue à ta banque"); } break; }
    case "op-bank-undo": { const o=opsOf(t.dataset.mk).find(x=>x.id===t.dataset.id); if(o){ delete o.bank; Store.saveMonth(t.dataset.mk); render(); } break; }
    case "health-ok": { const o=opsOf(t.dataset.mk).find(x=>x.id===t.dataset.id); if(o){ o.health="rembourse_ok"; Store.saveMonth(t.dataset.mk); render(); toast("Marqué remboursé"); } break; }
    case "st-f": state.stF=t.dataset.k; render(); break;
    case "pt-f": state.ptF=t.dataset.k; render(); break;
    case "op-deb": { const o=opsOf(t.dataset.mk).find(x=>x.id===t.dataset.id); if(o){ o.debited=true; Store.saveMonth(t.dataset.mk); render(); } break; }
    case "vu-all": { for(const o of ptLists().vu){ o.bank=true; } for(const m of allMonths()) Store.saveMonth(m); render(); toast("Tout est noté « vu à la banque »"); break; }
    case "deb-all": { for(const o of ptLists().deb){ o.debited=true; } for(const m of allMonths()) Store.saveMonth(m); render(); toast("Tout est noté « débité »"); break; }
    case "op-tog": state.opOpen[t.dataset.k]=!state.opOpen[t.dataset.k]; render(); break;
    case "op-kind": state.filter.kind=t.dataset.k; render(); break;
    case "goto-month": state.month=t.dataset.mk; render(); window.scrollTo({top:0}); break;
    case "prev": state.month=addM(state.month,-1); render(); break;
    case "next": state.month=addM(state.month,1); render(); break;
    case "kind": state.form.kind=t.dataset.k; state.form.cat=null; if(state.editId){ state.editId=null; } render(); break;
    case "ask": state.confirm=t.dataset.key; render(); setTimeout(()=>{ if(state.confirm===t.dataset.key){ state.confirm=null; render(); } },4000); break;
    case "del-op": { const mk=t.dataset.mk; setMonthOps(mk,opsOf(mk).filter(o=>o.id!==t.dataset.id)); state.confirm=null; if(state.editId===t.dataset.id) state.editId=null; render(); toast("Opération supprimée"); break; }
    case "edit-op": state.editId=t.dataset.id; state.editMk=t.dataset.mk; state.opsTab="saisir"; if(state.tab!=="ops") state.tab="ops"; render(); window.scrollTo({top:0,behavior:"smooth"}); break;
    case "cancel-edit": state.editId=null; render(); break;
    case "rec-unpay": { const mk=t.dataset.mk; const l=opsOf(mk); const o=l.find(x=>x.recId===t.dataset.rid&&!x.imported); if(o){ setMonthOps(mk,l.filter(x=>x.id!==o.id)); delete state.avJust[t.dataset.rid]; render(); toast("Pointage annulé"); } break; }
    case "rec-unpay-all": { const mk=t.dataset.mk, ids=new Set((t.dataset.rids||"").split(",")); const l=opsOf(mk); const keep=l.filter(x=>!(x.recId&&ids.has(x.recId)&&!x.imported)); if(keep.length!==l.length){ setMonthOps(mk,keep); state.avJust={}; render(); toast("Pointage annulé"); } break; }

  const blob=new Blob([JSON.stringify(data)],{type:"application/json"}); const a=document.createElement("a");

function readJSON(file){
  const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.settings||!d.months) throw 0;
    state.pending=d; state.pendingInfo=Object.values(d.months).reduce((a,l)=>a+l.length,0)+" opérations, "+Object.keys(d.months).length+" mois"; state.confirm="restore"; render(); }

}
